name: Deploy VNPAY Travel Demo to GitHub Pages

on:
  push:
    branches:
      - claude/vnpay-demo-presentation-unX4h
    paths:
      - 'vnpay-travel-demo/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'vnpay-travel-demo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
